name: Package NuGet

# Builds the native library on every supported platform and packs a single
# multi-RID NuGet package, uploaded as a workflow artifact. Publishing to
# nuget.org is deliberately left as a manual step:
#
#   dotnet nuget push AUSoftware.PdfInspector.<version>.nupkg \
#     --source https://api.nuget.org/v3/index.json --api-key <key>

on:
  push:
    branches: [main]
    paths:
      - 'dotnet/**'
      - 'src/**'
      - '.github/workflows/package-nuget.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          # macos-13 was retired by GitHub; macos-15-intel is the remaining
          # Intel runner label (available through 2027).
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            dotnet/native -> target
          key: package-${{ matrix.rid }}

      - name: Build the native library
        run: cargo build --release --manifest-path dotnet/native/Cargo.toml

      - name: Verify the C ABI
        run: cargo test --release --manifest-path dotnet/native/Cargo.toml

      - name: Stage the runtime asset
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*) name=pdf_inspector_ffi.dll ;;
            osx-*) name=libpdf_inspector_ffi.dylib ;;
            *) name=libpdf_inspector_ffi.so ;;
          esac
          mkdir -p "dotnet/runtimes/${{ matrix.rid }}/native"
          cp "dotnet/native/target/release/$name" "dotnet/runtimes/${{ matrix.rid }}/native/$name"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.rid }}
          path: dotnet/runtimes/${{ matrix.rid }}/native/*
          if-no-files-found: error

  pack:
    name: Pack
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Collect the native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Lay out the runtime assets
        run: |
          set -euo pipefail
          for directory in artifacts/native-*; do
            rid="${directory#artifacts/native-}"
            mkdir -p "dotnet/runtimes/$rid/native"
            cp "$directory"/* "dotnet/runtimes/$rid/native/"
          done
          find dotnet/runtimes -type f

      - name: Pack
        run: dotnet pack dotnet/src/AUSoftware.PdfInspector/AUSoftware.PdfInspector.csproj -c Release -o dotnet/artifacts

      - name: Verify every runtime is in the package
        run: |
          set -euo pipefail
          package=$(ls dotnet/artifacts/*.nupkg)
          contents=$(unzip -Z1 "$package")
          echo "$contents"
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            echo "$contents" | grep -q "runtimes/$rid/native/" \
              || { echo "missing native asset for $rid"; exit 1; }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package
          path: dotnet/artifacts/*.nupkg
          if-no-files-found: error
